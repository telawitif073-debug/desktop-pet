services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: desktop_pet_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d desktop_pet_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin123}
    volumes:
      - minio-data:/data
    ports:
      - "9001:9001"

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: /bin/sh
    command: -c "until mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin123}; do sleep 2; done; mc mb --ignore-existing local/desktop-pet; mc anonymous set download local/desktop-pet"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin123}

  clamav:
    image: clamav/clamav:stable
    expose:
      - "3310"

  backend:
    build: ./backend
    env_file:
      - ./backend/.env.production
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_DATABASE: desktop_pet_platform
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      STORAGE_DRIVER: s3
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}/storage
      S3_BUCKET: desktop-pet
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin123}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_started
    expose:
      - "3001"

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
      - minio

volumes:
  postgres-data:
  minio-data:
