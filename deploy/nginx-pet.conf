# 宠物平台 nginx 配置：80 端口统一入口
# 静态分发（APK / 热更 bundle）+ API 反代
server {
    listen 80 default_server;
    server_name _;

    # 宠物资源 zip / APK 可到几十 MB
    client_max_body_size 100m;

    # APK 与热更 bundle 静态直出（/srv/dist-share 由部署包放置）
    location /MobilePet-1.0.apk {
        alias /srv/dist-share/MobilePet-1.0.apk;
        add_header Cache-Control "no-cache";
    }
    location ~ ^/pet-bundle-\d+\.zip$ {
        root /srv/dist-share;
        add_header Cache-Control "no-cache";
    }

    # API 与宠物资源走后端
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;   # LLM 代理类接口可能较慢
    }
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    # 根路径给一个简单的存活提示
    location = / {
        default_type text/plain;
        return 200 "desktop-pet platform is running\n";
    }
}
